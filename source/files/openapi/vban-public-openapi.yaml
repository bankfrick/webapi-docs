        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalEntityEndCustomerDto"
          description: CREATED
          headers:
            algorithm:
              description: "Algorithm used for signing the response. Default: rsa-sha512"
              required: true
              schema:
                type: string
            signature:
              description: "Cryptographic fingerprint of response body. For calculation\
