openapi: 3.0.1
info:
  title: Bank Frick VBAN API
  version: 0.6.0
servers:
- url: https://api.bankfrick.li/vban
- url: https://api-test.bankfrick.li/vban
security:
- bearerAuth: []
paths:
  /end-customers:
    get:
      operationId: getEndCustomers
      parameters:
      - description: Filter by end-customer kind
        in: query
        name: kind
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - NATURAL_PERSON
            - LEGAL_ENTITY
          uniqueItems: true
      - description: Filter by end-customer state
        in: query
        name: state
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PREPARED
            - ACTIVE
          uniqueItems: true
      - description: Filter by the caller's own identifier
        example: customer-4711
        in: query
        name: externalReference
        required: false
        schema:
          type: string
      - description: Return only end customers whose lastModifiedAt is strictly after
          this ISO 8601 timestamp
        example: 2026-05-20T08:00:00Z
        in: query
        name: lastModifiedAfter
        required: false
        schema:
          type: string
          format: date-time
      - description: "Page size, default 100"
        example: "10"
        in: query
        name: pageSize
        required: false
        schema:
          type: string
      - description: "Page index, default 0"
        example: "2"
        in: query
        name: pageIndex
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndCustomersDto"
          description: OK
          headers:
            algorithm:
              description: "Algorithm used for signing the response. Default: rsa-sha512"
              required: true
              schema:
                type: string
            signature:
              description: "Cryptographic fingerprint of response body. For calculation\
                \ method, see <algorithm> header."
              required: true
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: Get end customers
      tags:
      - End Customers Controller
  /end-customers/approvals:
    put:
      operationId: approveEndCustomer
      parameters:
      - description: Cryptographic fingerprint of request body. Provide used algorithm
          in <algorithm> header.
        in: header
        name: signature
        required: true
        schema:
          type: string
      - description: "Algorithm used for signing the request. Supported algorithms:\
          \ rsa-sha512, rsa-sha384, rsa-sha256. If not provided, the server assumes\
          \ rsa-sha512."
        in: header
        name: algorithm
        required: false
        schema:
          type: string
          default: rsa-sha512
          enum:
          - rsa-sha512
          - rsa-sha384
          - rsa-sha256
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveEndCustomerDto"
        required: true
      responses:
        "200":
          content:
            application/json:
